name: Deploy to Trigger.dev (prod)

# Upstream auto-deploys to Trigger.dev on push to main. Forks have no Trigger.dev
# project secrets, so the auto-run only produces a public red X. Kept for
# reference; run manually via workflow_dispatch if Trigger.dev is ever adopted.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm install

      - name: 🚀 Deploy Trigger.dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_PROJECT_ID: ${{ secrets.TRIGGER_PROJECT_ID }}
        run: |
          npm run deploy:trigger-prod
