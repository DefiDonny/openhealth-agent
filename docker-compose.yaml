services:
  database:
    image: postgres:alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
  app:
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
    - database
    volumes:
    - app_data:/app/public/uploads
    ports:
    - 127.0.0.1:3000:3000
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV}
      SYNC_API_KEY: ${SYNC_API_KEY}
      SYNC_SERVICE_URL: http://whoop-sync:3001
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch(\\\"http://127.0.0.1:3000/\\\").then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
  whoop-sync:
    build:
      context: ./whoop-sync
      dockerfile: Dockerfile
    restart: always
    depends_on:
    - database
    ports:
    - 127.0.0.1:3001:3001
    environment:
      BIND_HOST: 0.0.0.0
      POSTGRES_HOST: database
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      WHOOP_CLIENT_ID: ${WHOOP_CLIENT_ID}
      WHOOP_CLIENT_SECRET: ${WHOOP_CLIENT_SECRET}
      WHOOP_REDIRECT_URI: ${WHOOP_REDIRECT_URI}
      WITHINGS_CLIENT_ID: ${WITHINGS_CLIENT_ID}
      WITHINGS_CLIENT_SECRET: ${WITHINGS_CLIENT_SECRET}
      WITHINGS_REDIRECT_URI: ${WITHINGS_REDIRECT_URI}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      SYNC_API_KEY: ${SYNC_API_KEY}
      SYNC_CRON_ENABLED: 'true'
      TOKEN_FILE: /app/tokens/tokens.json
      WITHINGS_TOKEN_FILE: /app/tokens/withings_tokens.json
    volumes:
    - sync_tokens:/app/tokens
volumes:
  postgres_data: null
  app_data: null
  sync_tokens: null
